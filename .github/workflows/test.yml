name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest

      - name: Run CPU tests
        run: pytest -m "not cuda and not triton" -q

  docs:
    name: docs (strict sphinx build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `--no-deps` installs the package metadata and nothing else:
      # autodoc imports `cherimoya`, whose `__init__` calls
      # `importlib.metadata.version("cherimoya")`, while conf.py mocks
      # torch and the rest. So this does not check that the package's
      # real dependencies import -- the pytest job above does.
      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e . --no-deps

      - name: Build with warnings as errors
        run: python -m sphinx -W -b html docs docs/_build/html

  lint:
    name: lint (ruff, error-class rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      # Narrow on purpose: the default rule set reports ~29 findings on
      # this tree, and fixing those is a separate change from adding the
      # gate.
      - name: Run ruff
        run: ruff check --select=E9,F63,F7,F82 cherimoya cherimoya_cli tests
